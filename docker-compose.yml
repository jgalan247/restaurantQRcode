services:
  postgres:
    image: postgres:15-alpine
    container_name: lahacienda-db
    environment:
      POSTGRES_USER: lahacienda
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: lahacienda
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lahacienda"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - lahacienda-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: lahacienda-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lahacienda:password123@lahacienda-db:5432/lahacienda
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lahacienda-network
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lahacienda-web
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - lahacienda-network

networks:
  lahacienda-network:
    driver: bridge

volumes:
  postgres_data: