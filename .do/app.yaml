name: lahacienda-ordering
region: lon

databases:
  - engine: PG
    name: lahacienda-db
    num_nodes: 1
    size: db-s-dev-database
    version: "15"

services:
  - name: backend
    source_dir: backend
    github:
      branch: feature/complete-admin-system
      deploy_on_push: true
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${lahacienda-db.DATABASE_URL}
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://${_self.HOSTNAME}"]'
      - key: GST_RATE
        value: "0.05"
      - key: CURRENCY
        value: GBP

  - name: frontend
    source_dir: frontend
    github:
      branch: feature/complete-admin-system
      deploy_on_push: true
    build_command: npm install && npm run build
    output_dir: dist
    static_site: true
    envs:
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: ${backend.PUBLIC_URL}/api/v1
      - key: VITE_APP_NAME
        scope: BUILD_TIME
        value: La Hacienda
    # Environment vars must be available at BUILD_TIME for Vite
