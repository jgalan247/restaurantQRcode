name: lahacienda-ordering
region: lon

databases:
  - engine: PG
    name: lahacienda-db
    num_nodes: 1
    size: db-s-dev-database
    version: "15"

services:
  # Backend API Service
  - name: backend
    source_dir: backend
    github:
      branch: main
      deploy_on_push: true
      repo: jgalan247/restaurantQRcode
    build_command: pip install -r requirements.txt
    run_command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --root-path /api
    http_port: 8000
    instance_size_slug: basic-xxs
    instance_count: 1
    routes:
      - path: /api
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${lahacienda-db.DATABASE_URL}
      - key: DEBUG
        value: "False"
      - key: ENVIRONMENT
        value: production
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: GST_RATE
        value: "0.05"
      - key: CURRENCY
        value: GBP
      - key: CITYPAY_BASE_URL
        value: https://secure.citypay.com
      - key: MAIL_SERVER
        value: smtp.sendgrid.net
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_FROM
        value: noreply@lahacienda.co.uk
      - key: MAIL_FROM_NAME
        value: La Hacienda Restaurant
      - key: RESTAURANT_NAME
        value: La Hacienda
      - key: RESTAURANT_ADDRESS
        value: "123 Mexican Street, London, UK"
      - key: RESTAURANT_PHONE
        value: "+44 20 1234 5678"
      - key: RESTAURANT_EMAIL
        value: info@lahacienda.co.uk

  # Frontend Static Site
  - name: frontend
    source_dir: frontend
    github:
      branch: main
      deploy_on_push: true
      repo: jgalan247/restaurantQRcode
    build_command: npm install && npm run build
    output_dir: dist
    error_document: index.html
    routes:
      - path: /
    envs:
      - key: VITE_APP_NAME
        scope: BUILD_TIME
        value: La Hacienda
